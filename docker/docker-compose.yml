# swiyu-verifier (Swiss E-ID Public Beta) + PostgreSQL
#
# Preparation:
#   1. Create docker/.env from docker/.env.example and fill in the values
#      (VERIFIER_DID, DID_VERIFICATION_METHOD, SIGNING_KEY, EXTERNAL_URL)
#   2. docker compose up -d
#
# Afterwards:
#   Management API : http://localhost:8083  (internal only — NEVER expose publicly!)
#   Swagger UI     : http://localhost:8083/swagger-ui/index.html
#   OID4VP API     : must be publicly reachable via HTTPS at EXTERNAL_URL
#                    (e.g. reverse proxy on /oid4vp/* — see proxy/Caddyfile.example)

name: miswiyuverifier

services:
  verifier_postgres:
    image: postgres:15-alpine
    container_name: miSWIYUverifier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "verifier_user"
      POSTGRES_PASSWORD: "secret"
      POSTGRES_DB: "verifier_db"
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U verifier_user -d verifier_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  verifier-service:
    # Pin the version: 4.x speaks OID4VP 1.0, which the swiyu wallet now enforces.
    # Up to 3.x the authorization request still carried the draft-era
    # "client_id_scheme": "did" plus an unprefixed client_id — the wallet rejects
    # that when scanning the QR code with "invalid_request". Since 4.0.0 the
    # client_id is prefixed instead (client_id_prefix, default
    # "decentralized_identifier").
    image: ghcr.io/swiyu-admin-ch/swiyu-verifier:4.2.0
    container_name: miSWIYUverifier-verifier
    restart: unless-stopped
    depends_on:
      verifier_postgres:
        condition: service_healthy
    configs:
      - source: verifier_metadata
        target: /verifier_metadata.json
    ports:
      - "8083:8080"
    environment:
      EXTERNAL_URL: ${EXTERNAL_URL}
      OPENID_CLIENT_METADATA_FILE: file:/verifier_metadata.json
      VERIFIER_DID: ${VERIFIER_DID}
      DID_VERIFICATION_METHOD: ${DID_VERIFICATION_METHOD}
      SIGNING_KEY: ${SIGNING_KEY}
      VERIFICATION_TTL_SEC: ${VERIFICATION_TTL_SEC:-900}
      # The BCS status list token carries no "exp" claim, but swiyu-verifier 4.x
      # requires one by default. Without this the status check fails its
      # precondition and reports credential_revoked / "Credential is not valid"
      # for perfectly valid credentials — the error is indistinguishable from a
      # real revocation. The v3-to-v4 migration guide names BCS explicitly as the
      # issuer this applies to.
      VERIFICATION_EXPIRY_MUST_BE_PRESENT: "false"
      # Persistence
      POSTGRES_USER: "verifier_user"
      POSTGRES_PASSWORD: "secret"
      POSTGRES_DB: "verifier_db"
      POSTGRES_JDBC: "jdbc:postgresql://verifier_postgres:5432/verifier_db"

configs:
  # Client metadata per OID4VP 1.0: the key is "vp_formats_supported" (not the
  # draft-era "vp_formats"), and it must declare the credential format actually
  # requested — "dc+sd-jwt" for the Beta-ID. Declaring only "jwt_vp" made the
  # swiyu wallet reject the authorization request with "invalid_request".
  verifier_metadata:
    content: |
      {
        "client_id": "${VERIFIER_DID}",
        "client_name#de": "miSWIYUverifier",
        "client_name#en": "miSWIYUverifier",
        "client_name": "miSWIYUverifier",
        "vp_formats_supported": {
          "dc+sd-jwt": {
            "sd-jwt_alg_values": [ "ES256", "Ed25519" ],
            "kb-jwt_alg_values": [ "ES256", "Ed25519" ]
          }
        }
      }
